name: Publish Python package

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tag matches the package version
        run: |
          VERSION="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "$VERSION" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject $VERSION"; exit 1; }

      - run: pip install build twine

      - run: python -m build

      - run: twine check --strict dist/*

      # `make publish` usually uploaded this version already from the
      # workstation; pushing its tag must not fail the run for that
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
