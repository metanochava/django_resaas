{% extends "django_resaas/email_base.html" %}

{% block content %}
  <p>{{ greeting }}</p>
  <p>{{ intro }}</p>

  <p style="text-align:center; margin:32px 0;">
    <a href="{{ link }}"
       style="background:{{ brand_color|default:'#1976d2' }}; color:#ffffff; text-decoration:none;
              padding:12px 28px; border-radius:8px; display:inline-block; font-weight:600;">
      {{ button_label }}
    </a>
  </p>

  <p style="color:#777777; font-size:13px;">{{ ignore_notice }}</p>
{% endblock %}
