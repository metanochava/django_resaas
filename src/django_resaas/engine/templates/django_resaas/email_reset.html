<!DOCTYPE html>
<html>
  <body style="font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 24px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0"
                 style="background: #ffffff; border-radius: 8px; padding: 32px;">
            <tr>
              <td style="text-align: center; padding-bottom: 16px;">
                {% if logo %}<img src="{{ logo }}" alt="" style="max-height: 48px;">{% endif %}
              </td>
            </tr>
            <tr>
              <td style="font-size: 16px; color: #333333;">
                <p>Hi {{ username }},</p>
                <p>We received a request to reset your password. Click the button below to choose a new one.</p>
                <p style="text-align: center; margin: 32px 0;">
                  <a href="{{ link }}"
                     style="background: #1976d2; color: #ffffff; text-decoration: none;
                            padding: 12px 24px; border-radius: 6px; display: inline-block;">
                    Reset password
                  </a>
                </p>
                <p style="color: #777777; font-size: 13px;">
                  If you didn't request this, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
